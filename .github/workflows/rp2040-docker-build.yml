name: Build and Push RP2040 Container

# kvasirio/rp2040: Kvasir_SDK's chip-image.yml builds it from Kvasir_SDK scripts/Dockerfile.chip with this repository
# as the context and sets the "RP2040 Container Build" commit status. The file name is what Kvasir_SDK's
# dispatch-chip-images.yml dispatches after a new kvasirio/kvasir image or a kvasir_devices push.

on:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    image:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/chip-image.yml@master
        with: {chip: rp2040, title: RP2040, extra-aur-packages: picotool}
        secrets: inherit
